<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Planning en productiebeheer</title>
<style>
  :root {
    --stage:        #ededed;
    --panel:        #ffffff;
    --blue:         #a1d0e2;
    --blue-strong:  #8ec3da;
    --amber:        #ffdfae;
    --chip-bg:      #dee3e9;
    --chip-ink:     #798092;
    --ink:          #1a2733;
    --ink-soft:     #6b7682;
    --dark-tile:    #14263c;
    --hairline:     rgba(20,38,60,.10);

    --shadow-sm: 0 1px 2px rgba(15,23,42,.05), 0 2px 6px rgba(15,23,42,.05);
    --shadow-md: 0 6px 16px rgba(15,23,42,.08), 0 2px 4px rgba(15,23,42,.04);
    --shadow-lg: 0 18px 40px rgba(15,23,42,.14), 0 6px 14px rgba(15,23,42,.08);

    --r-md: 14px;
    --r-lg: 22px;
    --r-pill: 999px;
    --t: 280ms cubic-bezier(.2,.7,.2,1);
  }

  * { box-sizing: border-box; }

  html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    margin: 0;
    padding: 0;
  }

  body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  button {
    appearance: none;
    -webkit-appearance: none;
    border: 0;
    background: none;
    font: inherit;
    color: inherit;
    padding: 0;
    margin: 0;
    text-align: left;
    cursor: pointer;
  }

  /* Stage */
  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    background: var(--stage);
    border-radius: 18px;
    overflow: hidden;
    isolation: isolate;
  }

  .stage::before {
    content: "";
    position: absolute;
    width: 130%;
    aspect-ratio: 1 / 1;
    left: 14%;
    top: 24%;
    border-radius: 50%;
    background: #ffffff;
    z-index: 0;
  }

  /* Grid */
  .grid {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 0.85fr 1.3fr;
    grid-template-rows: 1fr;
    align-items: center;
    gap: 22px 30px;
    padding: 28px 32px;
    height: 100%;
  }

  .col { display: flex; flex-direction: column; }
  .col-fase { grid-column: 1; align-items: flex-start; align-self: center; }
  .col-med  { grid-column: 2; align-items: flex-end; align-self: center; }

  /* Section label */
  .label {
    display: inline-flex;
    align-items: center;
    background: var(--chip-bg);
    color: var(--chip-ink);
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: var(--r-pill);
    font-weight: 600;
    margin-bottom: 12px;
    width: fit-content;
  }

  /* Generic card hover */
  .card {
    position: relative;
    transition: transform var(--t), box-shadow var(--t);
    will-change: transform;
  }
  .card:hover {
    transform: translateY(-4px) scale(1.025);
    box-shadow: var(--shadow-lg);
    z-index: 5;
  }
  .card:active { transform: translateY(-1px) scale(1.01); transition-duration: 80ms; }

  /* Blue card (Fase) */
  .bluecard {
    background: var(--blue);
    border-radius: var(--r-lg);
    padding: 14px 18px;
    box-shadow: var(--shadow-sm);
    width: fit-content;
  }
  .bluecard-list { display: flex; flex-direction: column; }
  .brow {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 8px;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    border-radius: 10px;
    transition: background-color var(--t), transform var(--t);
    min-width: 200px;
  }
  .brow + .brow { border-top: 1px solid var(--hairline); }
  .brow:hover { background: rgba(255,255,255,.45); }
  .brow .ico {
    width: 32px; height: 32px;
    background: var(--dark-tile);
    color: #fff;
    border-radius: 8px;
    display: grid; place-items: center;
    flex: none;
  }

  /* White card (Medewerkers) */
  .whitecard {
    background: var(--panel);
    border-radius: var(--r-lg);
    padding: 18px 24px;
    box-shadow: var(--shadow-md);
  }
  .whitecard-list { display: flex; flex-direction: column; }
  .wrow {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 14px 6px;
    border-radius: 12px;
    transition: background-color var(--t), transform var(--t);
  }
  .wrow + .wrow { border-top: 1px solid #eaecef; }
  .wrow .ico {
    width: 44px; height: 44px;
    background: var(--blue);
    color: var(--ink);
    border-radius: 10px;
    display: grid; place-items: center;
    flex: none;
    transition: background-color var(--t), transform var(--t);
  }
  .wrow:hover { background: #f7fafc; transform: translateX(2px); }
  .wrow:hover .ico { background: var(--blue-strong); transform: scale(1.06); }
  .wrow h3 { margin: 0 0 2px 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--ink); }
  .wrow p { margin: 0; font-size: 13.5px; color: var(--ink-soft); }

  /* Responsive */
  @media (prefers-reduced-motion: reduce) {
    .card, .wrow, .brow, .wrow .ico { transition: none !important; }
    .card:hover, .wrow:hover { transform: none; }
  }

  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; grid-template-rows: auto auto; padding: 16px; gap: 14px; }
    .col-fase, .col-med { grid-column: 1; align-items: flex-start; }
  }
</style>
</head>
<body>
  <main class="stage" aria-label="Planning en productiebeheer">
    <div class="grid">

      <!-- FASE -->
      <section class="col col-fase" aria-labelledby="lbl-fase">
        <span class="label" id="lbl-fase">Fase</span>
        <div class="card bluecard" role="group">
          <div class="bluecard-list">
            <button class="brow" type="button">
              <span class="ico" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16"/><path d="M8 3v4M16 3v4"/></svg>
              </span>
              Gepland
            </button>
            <button class="brow" type="button">
              <span class="ico" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
              </span>
              In productie
            </button>
            <button class="brow" type="button">
              <span class="ico" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 13l4-5 4 5M12 8v9"/></svg>
              </span>
              Gepubliceerd
            </button>
            <button class="brow" type="button">
              <span class="ico" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><path d="M10 13h4"/></svg>
              </span>
              Gearchiveerd
            </button>
          </div>
        </div>
      </section>

      <!-- MEDEWERKERS -->
      <section class="col col-med" aria-labelledby="lbl-med">
        <span class="label" id="lbl-med" style="align-self:flex-end;">Medewerkers</span>
        <div class="card whitecard" role="group" style="width:100%;">
          <div class="whitecard-list">
            <button class="wrow" type="button">
              <span class="ico" aria-hidden="true">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg>
              </span>
              <div><h3>Auteurs</h3><p>Verantwoordelijk voor contentcreatie</p></div>
            </button>
            <button class="wrow" type="button">
              <span class="ico" aria-hidden="true">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              </span>
              <div><h3>Redacteuren</h3><p>Bewaken kwaliteit en inhoud</p></div>
            </button>
            <button class="wrow" type="button">
              <span class="ico" aria-hidden="true">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h8M7 3v2M5 9c1 3 3 5 6 6"/><path d="M9 9c-1 3-3 5-6 6"/><path d="M13 21l5-11 5 11M15 17h6"/></svg>
              </span>
              <div><h3>Vertalers</h3><p>Zorgen voor meertalige publicaties</p></div>
            </button>
            <button class="wrow" type="button">
              <span class="ico" aria-hidden="true">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l6 6-12 12H2v-6z"/><path d="M14 4l2-2a2 2 0 0 1 3 3l-2 2"/></svg>
              </span>
              <div><h3>Illustratoren</h3><p>Verzorgen visuele content en beeldmateriaal</p></div>
            </button>
          </div>
        </div>
      </section>

    </div>
  </main>
</body>
</html>
