<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flexibele abonnementsmodellen</title>
<template id="__bundler_thumbnail" data-bg-color="#ededed">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect x="120" y="160" rx="36" ry="36" width="380" height="80" fill="#ffffff"/>
    <rect x="120" y="270" rx="36" ry="36" width="380" height="80" fill="#a1d0e2"/>
    <rect x="120" y="380" rx="36" ry="36" width="380" height="80" fill="#ffffff"/>
    <rect x="600" y="140" rx="32" ry="32" width="500" height="320" fill="#ffffff"/>
    <rect x="640" y="190" width="60" height="60" rx="12" fill="#a1d0e2"/>
    <rect x="640" y="280" width="60" height="60" rx="12" fill="#a1d0e2"/>
    <rect x="640" y="370" width="60" height="60" rx="12" fill="#a1d0e2"/>
    <rect x="120" y="520" rx="40" ry="40" width="380" height="220" fill="#a1d0e2"/>
    <rect x="600" y="600" rx="20" ry="20" width="240" height="120" fill="#ffffff"/>
    <rect x="870" y="600" rx="20" ry="20" width="230" height="120" fill="#ffffff"/>
    <rect x="620" y="620" width="44" height="44" rx="9" fill="#ffdfae"/>
    <rect x="890" y="620" width="44" height="44" rx="9" fill="#ffdfae"/>
  </svg>
</template>
<style>
  :root {
    /* Sampled directly from the reference */
    --stage:        #ededed;       /* page/stage bg */
    --panel:        #ffffff;       /* white cards & inactive pills */
    --blue:         #a1d0e2;       /* primary accent: pill active, marketing card, icon tiles */
    --blue-strong:  #8ec3da;       /* hover deepening */
    --amber:        #ffdfae;       /* bundle tiles */
    --amber-strong: #f5cf8e;
    --chip-bg:      #dee3e9;       /* section-label pill bg */
    --chip-ink:     #798092;       /* section-label text */
    --ink:          #1a2733;       /* primary text */
    --ink-soft:     #6b7682;       /* secondary text */
    --dark-tile:    #14263c;       /* dark icon tile inside marketing card */
    --hairline:     rgba(20,38,60,.10);

    --shadow-sm: 0 1px 2px rgba(15,23,42,.05), 0 2px 6px rgba(15,23,42,.05);
    --shadow-md: 0 6px 16px rgba(15,23,42,.08), 0 2px 4px rgba(15,23,42,.04);
    --shadow-lg: 0 18px 40px rgba(15,23,42,.14), 0 6px 14px rgba(15,23,42,.08);

    --r-md: 14px;
    --r-lg: 22px;
    --r-pill: 999px;

    --t: 280ms cubic-bezier(.2,.7,.2,1);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  /* button UA reset */
  button {
    appearance: none;
    -webkit-appearance: none;
    border: 0;
    background: none;
    font: inherit;
    color: inherit;
    padding: 0;
    margin: 0;
    text-align: left;
    cursor: pointer;
  }

  body {
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    padding: 32px;
  }

  .stage {
    position: relative;
    max-width: 1000px;
    margin: 0 auto;
    aspect-ratio: 1500 / 1000;
    background: var(--stage);
    border-radius: 18px;
    overflow: hidden;
    isolation: isolate;
  }

  /* large white arc behind the abonnementstype card, like the reference */
  .stage::before {
    content: "";
    position: absolute;
    width: 130%;
    aspect-ratio: 1 / 1;
    left: 14%;
    top: 24%;
    border-radius: 50%;
    background: #ffffff;
    z-index: 0;
  }

  .grid {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 1fr 1.55fr;
    grid-template-rows: auto auto;
    gap: 22px 30px;
    padding: 40px 44px 44px;
    height: 100%;
  }

  /* Section labels */
  .label {
    display: inline-flex;
    align-items: center;
    background: var(--chip-bg);
    color: var(--chip-ink);
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: var(--r-pill);
    font-weight: 600;
    margin-bottom: 12px;
    width: fit-content;
  }

  .col { display: flex; flex-direction: column; }

  /* ---------- Generic interactive card ---------- */
  .card {
    position: relative;
    transition:
      transform var(--t),
      box-shadow var(--t),
      background-color var(--t);
    will-change: transform;
    transform-origin: center;
  }
  .card:focus-visible {
    outline: 2px solid #2563eb;
    outline-offset: 4px;
  }
  .card:hover {
    transform: translateY(-4px) scale(1.045);
    box-shadow: var(--shadow-lg);
    z-index: 5;
  }
  .card:active {
    transform: translateY(-1px) scale(1.015);
    transition-duration: 80ms;
  }
  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    box-shadow: 0 0 0 0 rgba(37,99,235,0);
    pointer-events: none;
    transition: box-shadow var(--t);
  }
  .card:hover::after {
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
  }

  /* ---------- Looptijd column ---------- */
  .looptijd { gap: 12px; }
  .pill {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel);
    border-radius: var(--r-pill);
    padding: 10px 22px 10px 14px;
    box-shadow: var(--shadow-sm);
    width: fit-content;
    font-size: 16px;
    font-weight: 500;
    color: var(--ink);
  }
  .pill.is-active { background: var(--blue); }
  .pill .ico {
    width: 22px; height: 22px;
    display: grid; place-items: center;
    color: var(--ink);
    flex: none;
  }

  /* ---------- Marketing card ---------- */
  .marketing {
    background: var(--blue);
    border-radius: var(--r-lg);
    padding: 14px 18px;
    box-shadow: var(--shadow-sm);
    width: fit-content;
    margin-top: 10px;
  }
  .marketing-list {
    display: flex;
    flex-direction: column;
  }
  .mrow {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 8px;
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
    border-radius: 10px;
    transition: background-color var(--t), transform var(--t);
    min-width: 220px;
  }
  .mrow + .mrow { border-top: 1px solid var(--hairline); }
  .mrow:hover {
    background: rgba(255,255,255,.45);
  }
  .mrow .ico {
    width: 32px; height: 32px;
    background: var(--dark-tile);
    color: #fff;
    border-radius: 8px;
    display: grid; place-items: center;
    flex: none;
  }

  /* ---------- Abonnementstype card ---------- */
  .abo {
    background: var(--panel);
    border-radius: var(--r-lg);
    padding: 18px 24px;
    box-shadow: var(--shadow-md);
  }
  .abo-list {
    display: flex;
    flex-direction: column;
  }
  .arow {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 14px 6px;
    border-radius: 12px;
    transition: background-color var(--t), transform var(--t);
  }
  .arow + .arow { border-top: 1px solid #eaecef; }
  .arow .ico {
    width: 44px; height: 44px;
    background: var(--blue);
    color: var(--ink);
    border-radius: 10px;
    display: grid; place-items: center;
    flex: none;
    transition: background-color var(--t), transform var(--t);
  }
  .arow:hover {
    background: #f7fafc;
    transform: translateX(2px);
  }
  .arow:hover .ico {
    background: var(--blue-strong);
    transform: scale(1.06);
  }
  .arow h3 {
    margin: 0 0 2px 0;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .arow p {
    margin: 0;
    font-size: 13.5px;
    color: var(--ink-soft);
  }

  /* ---------- Bundelen ---------- */
  .bundelen {
    grid-column: 2 / 3;
    align-self: end;
  }
  .bundle-row {
    display: flex;
    gap: 14px;
    align-items: stretch;
  }
  .bundle {
    background: var(--panel);
    border-radius: var(--r-md);
    padding: 14px 18px;
    box-shadow: var(--shadow-sm);
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .bundle .top {
    display: flex; align-items: center; gap: 10px;
    font-size: 16px; font-weight: 700; color: var(--ink);
  }
  .bundle .sub {
    font-size: 12.5px;
    color: var(--ink-soft);
    font-weight: 500;
  }
  .ico-amber {
    width: 28px; height: 28px;
    background: var(--amber);
    color: #b66a14;
    border-radius: 7px;
    display: grid; place-items: center;
    flex: none;
  }
  .ico-blue-tile {
    width: 28px; height: 28px;
    background: var(--blue);
    color: var(--ink);
    border-radius: 7px;
    display: grid; place-items: center;
    flex: none;
  }
  .plus { color: var(--ink); font-weight: 700; }

  @media (prefers-reduced-motion: reduce) {
    .card, .arow, .mrow, .arow .ico { transition: none !important; }
    .card:hover { transform: none; }
  }

  @media (max-width: 720px) {
    body { padding: 12px; }
    .grid { grid-template-columns: 1fr; padding: 22px; gap: 18px; }
    .bundelen { grid-column: 1; }
    .bundle-row { flex-direction: column; }
  }
</style>
</head>
<body>

  <main class="stage" aria-label="Flexibele abonnementsmodellen voor print, digitaal en hybride">
    <div class="grid">

      <!-- LOOPTIJD -->
      <section class="col looptijd" aria-labelledby="lbl-looptijd">
        <span class="label" id="lbl-looptijd">Looptijd</span>

        <button class="card pill" type="button">
          <span class="ico" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          </span>
          Vaste termijn
        </button>

        <button class="card pill is-active" type="button">
          <span class="ico" aria-hidden="true">
            <!-- two-arrow circular sync -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.5-5.7L20 8"/><path d="M20 4v4h-4"/><path d="M20 12a8 8 0 0 1-13.5 5.7L4 16"/><path d="M4 20v-4h4"/></svg>
          </span>
          Auto-verlenging
        </button>

        <button class="card pill" type="button">
          <span class="ico" aria-hidden="true">
            <!-- dashed circular arrow -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2.5 2.4"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 21v-5h5" stroke-dasharray="0"/></svg>
          </span>
          Verlengverzoek
        </button>
      </section>

      <!-- ABONNEMENTSTYPE -->
      <section class="col" aria-labelledby="lbl-abo" style="align-items: flex-end;">
        <span class="label" id="lbl-abo" style="align-self: flex-end;">Abonnementstype</span>

        <div class="card abo" role="group" aria-label="Abonnementstypen" style="width: 100%;">
          <div class="abo-list">

            <button class="arow" type="button">
              <span class="ico" aria-hidden="true">
                <!-- printer -->
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9V4h10v5"/><rect x="3" y="9" width="18" height="9" rx="2"/><rect x="7" y="14" width="10" height="6" rx="1.2"/><circle cx="17" cy="12.5" r=".9" fill="currentColor" stroke="none"/></svg>
              </span>
              <div>
                <h3>Print abonnement</h3>
                <p>Toegang tot alle print content</p>
              </div>
            </button>

            <button class="arow" type="button">
              <span class="ico" aria-hidden="true">
                <!-- laptop -->
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="10" rx="1.5"/><path d="M2 19h20"/></svg>
              </span>
              <div>
                <h3>Digitaal abonnement</h3>
                <p>Toegang tot alle digitale content</p>
              </div>
            </button>

            <button class="arow" type="button">
              <span class="ico" aria-hidden="true">
                <!-- laptop with diagonal slash -->
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="10" rx="1.5"/><path d="M2 19h20"/><path d="M4 18 20 6"/></svg>
              </span>
              <div>
                <h3>Hybride abonnement</h3>
                <p>Toegang tot alle print en digitale content</p>
              </div>
            </button>

          </div>
        </div>
      </section>

      <!-- MARKETING -->
      <section class="col" aria-labelledby="lbl-mkt">
        <span class="label" id="lbl-mkt">Marketing</span>

        <div class="card marketing" role="group" aria-label="Marketing">
          <div class="marketing-list">

            <button class="mrow" type="button">
              <span class="ico" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
              </span>
              Proefperiodes
            </button>

            <button class="mrow" type="button">
              <span class="ico" aria-hidden="true">
                <!-- percent -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="2.4"/><circle cx="17" cy="17" r="2.4"/><path d="M19 5 5 19"/></svg>
              </span>
              Kortingen
            </button>

            <button class="mrow" type="button">
              <span class="ico" aria-hidden="true">
                <!-- crown -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/><path d="M5 19h14"/></svg>
              </span>
              Premiums
            </button>

          </div>
        </div>
      </section>

      <!-- BUNDELEN -->
      <section class="col bundelen" aria-labelledby="lbl-bnd">
        <span class="label" id="lbl-bnd" style="align-self:center;">Bundelen</span>

        <div class="bundle-row">

          <button class="card bundle" type="button">
            <div class="top">
              <span class="ico-amber" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="2.4"/><circle cx="17" cy="17" r="2.4"/><path d="M19 5 5 19"/></svg>
              </span>
              Kortingen
            </div>
            <div class="sub">10% korting op bundels</div>
          </button>

          <button class="card bundle" type="button">
            <div class="top">
              <span class="ico-amber" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9V4h10v5"/><rect x="3" y="9" width="18" height="9" rx="2"/><rect x="7" y="14" width="10" height="6" rx="1.2"/></svg>
              </span>
              Print
              <span class="plus">+</span>
              <span class="ico-blue-tile" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="10" rx="1.5"/><path d="M2 19h20"/></svg>
              </span>
              digitaal
            </div>
            <div class="sub">Bundel print en digitaal</div>
          </button>

        </div>
      </section>

    </div>
  </main>

</body>
</html>
