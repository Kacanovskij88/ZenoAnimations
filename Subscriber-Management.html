<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Centraal abonneebeheer en geautomatiseerde bezorging</title>
<link rel="stylesheet" href="_shared.css" />
<style>
  .grid {
    grid-template-columns: 1fr 1.4fr;
    grid-template-rows: auto auto auto;
    gap: 12px 28px;
    padding: 28px 36px 28px;
  }
  .col-roll { grid-column: 1; grid-row: 1; align-items: flex-start; gap: 8px; }
  .col-self { grid-column: 2; grid-row: 1 / span 2; align-items: flex-end; }
  .col-bez  { grid-column: 1; grid-row: 2; align-items: flex-start; }
  .col-grp  { grid-column: 1 / -1; grid-row: 3; align-items: center; margin-top: 4px; }

  .role-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border-radius: var(--r-pill);
    padding: 8px 18px 8px 12px;
    box-shadow: var(--shadow-sm);
    width: fit-content;
    min-width: 170px;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
  }
  .role-pill.is-active { background: var(--blue); }
  .role-pill .ico {
    width: 24px; height: 24px;
    background: var(--dark-tile);
    color: #fff;
    border-radius: 7px;
    display: grid; place-items: center;
    flex: none;
  }

  .bluecard { padding: 10px 14px; margin-top: 4px; }
  .brow { padding: 10px 6px; font-size: 16px; min-width: 220px; }

  .whitecard { padding: 14px 22px; }
  .wrow { padding: 11px 6px; }

  .grp-row {
    display: flex;
    gap: 14px;
    width: 100%;
    max-width: 720px;
  }
  .grp-row .minicard {
    text-align: left;
    align-items: flex-start;
    padding: 12px 16px;
  }
  .col-grp .label { margin-bottom: 6px; }
</style>
</head>
<body>
  <main class="stage" aria-label="Centraal abonneebeheer en geautomatiseerde bezorging">
    <div class="grid">

      <!-- ROLLENBEHEER -->
      <section class="col col-roll" aria-labelledby="lbl-roll">
        <span class="label" id="lbl-roll" style="margin-bottom:4px;">Rollenbeheer</span>

        <button class="card role-pill" type="button">
          <span class="ico" aria-hidden="true">
            <!-- user -->
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>
          </span>
          Abonnee
        </button>

        <button class="card role-pill is-active" type="button">
          <span class="ico" aria-hidden="true">
            <!-- wallet -->
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.2" fill="currentColor"/></svg>
          </span>
          Betaler
        </button>

        <button class="card role-pill" type="button">
          <span class="ico" aria-hidden="true">
            <!-- user with gear / admin -->
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="3.5"/><path d="M3 21c1-3.5 4-5.5 7-5.5s6 2 7 5.5"/><circle cx="18" cy="7" r="2"/><path d="M18 4v1M18 9v1M15 7h1M20 7h1"/></svg>
          </span>
          Beheerder
        </button>
      </section>

      <!-- SELF-SERVICE -->
      <section class="col col-self" aria-labelledby="lbl-self">
        <span class="label" id="lbl-self" style="align-self:flex-end;">Self-service</span>
        <div class="card whitecard" role="group" style="width:100%;">
          <div class="whitecard-list">
            <button class="wrow" type="button">
              <span class="ico" aria-hidden="true">
                <!-- map pin -->
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-7.5 7-13a7 7 0 1 0-14 0c0 5.5 7 13 7 13z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
              </span>
              <div>
                <h3>Adreswijziging</h3>
                <p>Wijzig adres eenvoudig zonder tussenkomst</p>
              </div>
            </button>
            <button class="wrow" type="button">
              <span class="ico" aria-hidden="true">
                <!-- suitcase -->
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M3 12h18"/></svg>
              </span>
              <div>
                <h3>Vakantiestops</h3>
                <p>Plan en beheer bezorgpauzes zelf</p>
              </div>
            </button>
            <button class="wrow" type="button">
              <span class="ico" aria-hidden="true">
                <!-- trending up -->
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>
              </span>
              <div>
                <h3>Upgrades</h3>
                <p>Pas je abonnement direct aan naar een hoger niveau</p>
              </div>
            </button>
          </div>
        </div>
      </section>

      <!-- BEZORGING -->
      <section class="col col-bez" aria-labelledby="lbl-bez">
        <span class="label" id="lbl-bez">Bezorging</span>
        <div class="card bluecard" role="group">
          <div class="bluecard-list">
            <button class="brow" type="button">
              <span class="ico" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M3 12h18"/></svg>
              </span>
              Vakantiestops
            </button>
            <button class="brow" type="button">
              <span class="ico" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-7.5 7-13a7 7 0 1 0-14 0c0 5.5 7 13 7 13z"/><circle cx="12" cy="9.5" r="2.2"/></svg>
              </span>
              Weekendadres
            </button>
          </div>
        </div>
      </section>

      <!-- GROEPSACCOUNTS -->
      <section class="col col-grp" aria-labelledby="lbl-grp">
        <span class="label" id="lbl-grp">Groepsaccounts</span>
        <div class="grp-row">
          <button class="card minicard" type="button">
            <div class="top">
              <span class="ico-amber" aria-hidden="true">
                <!-- two people / family -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.2"/><path d="M3 20c.8-3 3-5 6-5s5.2 2 6 5"/><path d="M14 17c.6-1.6 2-3 3.5-3 1.6 0 3 1.2 3.5 3"/></svg>
              </span>
              Familie
            </div>
            <div class="sub">Meerdere gebruikers binnen één abonnement</div>
          </button>
          <button class="card minicard" type="button">
            <div class="top">
              <span class="ico-amber" aria-hidden="true">
                <!-- briefcase -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M3 13h18"/></svg>
              </span>
              Zakelijk
            </div>
            <div class="sub">Abonnementen voor organisaties en teams</div>
          </button>
        </div>
      </section>

    </div>
  </main>
</body>
</html>
