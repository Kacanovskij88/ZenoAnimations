<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Financiële rapportage en integraties</title>
<link rel="stylesheet" href="_shared.css" />
<style>
  .grid {
    grid-template-columns: 1fr 1.3fr;
    grid-template-rows: 1fr;
    align-items: center;
  }
  .col-rap { grid-column: 1; align-items: flex-start; align-self: center; }
  .col-vrij { grid-column: 2; align-items: flex-end; align-self: center; }
</style>
</head>
<body>
  <main class="stage" aria-label="Financiële rapportage en integraties">
    <div class="grid">

      <!-- RAPPORTAGE (blue group) -->
      <section class="col col-rap" aria-labelledby="lbl-rap">
        <span class="label" id="lbl-rap">Rapportage</span>
        <div class="card bluecard" role="group">
          <div class="bluecard-list">
            <button class="brow" type="button">
              <span class="ico" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 17h5"/></svg>
              </span>
              Zeno standaard
            </button>
            <button class="brow" type="button">
              <span class="ico" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 17h5"/></svg>
              </span>
              PowerBI
            </button>
            <button class="brow" type="button">
              <span class="ico" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 17h5"/></svg>
              </span>
              BigQuery
            </button>
            <button class="brow" type="button">
              <span class="ico" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 17h5"/></svg>
              </span>
              Qlikview
            </button>
          </div>
        </div>
      </section>

      <!-- VRIJVAL ABONNEMENTEN -->
      <section class="col col-vrij" aria-labelledby="lbl-vrij">
        <span class="label" id="lbl-vrij" style="align-self:flex-end;">Vrijval abonnementen</span>
        <div class="card whitecard" role="group" style="width:100%;">
          <div class="whitecard-list">
            <button class="wrow" type="button">
              <span class="ico" aria-hidden="true">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.5 11.5a2 2 0 0 0 2 1.5h7.5a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/></svg>
              </span>
              <div>
                <h3>Bij verkoop</h3>
                <p>Vrijgave bij verkoopmoment</p>
              </div>
            </button>
            <button class="wrow" type="button">
              <span class="ico" aria-hidden="true">
                <!-- pie chart -->
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9v9z"/><path d="M21 12h-9V3a9 9 0 0 1 9 9z" fill="currentColor"/></svg>
              </span>
              <div>
                <h3>Per kwartaal</h3>
                <p>Vrijgave per kwartaalperiode</p>
              </div>
            </button>
            <button class="wrow" type="button">
              <span class="ico" aria-hidden="true">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4M16 3v4"/></svg>
              </span>
              <div>
                <h3>Per maand</h3>
                <p>Vrijgave op maandbasis</p>
              </div>
            </button>
            <button class="wrow" type="button">
              <span class="ico" aria-hidden="true">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4M16 3v4"/><path d="M7 14h2M11 14h2M15 14h2"/></svg>
              </span>
              <div>
                <h3>Per week</h3>
                <p>Vrijgave op weekbasis</p>
              </div>
            </button>
          </div>
        </div>
      </section>

    </div>
  </main>
</body>
</html>
