<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Uitvoering en orderverwerking</title>
<link rel="stylesheet" href="_shared.css" />
<style>
  .grid {
    grid-template-columns: 1fr 1.3fr;
    grid-template-rows: auto auto;
    gap: 14px 22px;
    padding: 28px 36px;
  }
  .col-dist { grid-column: 1 / -1; grid-row: 1; align-items: center; }
  .col-mag  { grid-column: 1; grid-row: 2; align-items: flex-start; align-self: center; }
  .col-web  { grid-column: 2; grid-row: 2; align-items: flex-end; align-self: center; }
  .col-dist .three-row { max-width: 760px; }
  .col-dist .minicard { padding: 12px 18px; }
</style>
</head>
<body>
  <main class="stage" aria-label="Uitvoering en orderverwerking">
    <div class="grid">

      <section class="col col-dist" aria-labelledby="lbl-dist">
        <span class="label" id="lbl-dist">Distributiepartners</span>
        <div class="three-row">
          <button class="card minicard" type="button"><div class="top"><span class="ico-amber" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="6" cy="6" r="1.5" fill="currentColor"/><circle cx="18" cy="6" r="1.5" fill="currentColor"/><circle cx="6" cy="18" r="1.5" fill="currentColor"/><circle cx="18" cy="18" r="1.5" fill="currentColor"/></svg></span>CB</div><div class="sub">Integratie met Centraal Boekhuis</div></button>
          <button class="card minicard" type="button"><div class="top"><span class="ico-amber" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="6" cy="6" r="1.5" fill="currentColor"/><circle cx="18" cy="6" r="1.5" fill="currentColor"/><circle cx="6" cy="18" r="1.5" fill="currentColor"/><circle cx="18" cy="18" r="1.5" fill="currentColor"/></svg></span>EDG</div><div class="sub">Aansluiting op EDG distributie</div></button>
          <button class="card minicard" type="button"><div class="top"><span class="ico-amber" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="6" cy="6" r="1.5" fill="currentColor"/><circle cx="18" cy="6" r="1.5" fill="currentColor"/><circle cx="6" cy="18" r="1.5" fill="currentColor"/><circle cx="18" cy="18" r="1.5" fill="currentColor"/></svg></span>Anderen</div><div class="sub">Koppelingen met externe partners</div></button>
        </div>
      </section>

      <section class="col col-mag" aria-labelledby="lbl-mag">
        <span class="label" id="lbl-mag">Magazijnen</span>
        <div class="card bluecard" role="group">
          <div class="bluecard-list">
            <button class="brow" type="button"><span class="ico" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16"/><path d="M9 14h6"/></svg></span>Enkel</button>
            <button class="brow" type="button"><span class="ico" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="9" height="14" rx="1.5"/><rect x="12" y="9" width="9" height="11" rx="1.5"/></svg></span>Meerdere</button>
            <button class="brow" type="button"><span class="ico" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h11v9H3z"/><path d="M14 10h5l2 3v3h-7"/><circle cx="7" cy="18" r="1.5"/><circle cx="17" cy="18" r="1.5"/></svg></span>Extern</button>
          </div>
        </div>
      </section>

      <section class="col col-web" aria-labelledby="lbl-web">
        <span class="label" id="lbl-web" style="align-self:center;">Webshops</span>
        <div class="card whitecard" role="group" style="width:100%;">
          <div class="whitecard-list">
            <button class="wrow" type="button"><span class="ico" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.5 11.5a2 2 0 0 0 2 1.5h7.5a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/></svg></span><div><h3>Shopify</h3><p>Directe koppeling via API</p></div></button>
            <button class="wrow" type="button"><span class="ico" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.5 11.5a2 2 0 0 0 2 1.5h7.5a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/></svg></span><div><h3>Magento</h3><p>Integratie met bestaande shops</p></div></button>
            <button class="wrow" type="button"><span class="ico" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.5 11.5a2 2 0 0 0 2 1.5h7.5a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/></svg></span><div><h3>Lightspeed</h3><p>Ondersteuning voor retailplatforms</p></div></button>
            <button class="wrow" type="button"><span class="ico" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.5 11.5a2 2 0 0 0 2 1.5h7.5a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/></svg></span><div><h3>Overig</h3><p>Flexibele webshopkoppelingen</p></div></button>
          </div>
        </div>
      </section>

    </div>
  </main>
</body>
</html>
