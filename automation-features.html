<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Automatisering en financiële verwerking</title>
<link rel="stylesheet" href="_shared.css" />
<style>
  .grid {
    grid-template-columns: 1fr 1.55fr;
    grid-template-rows: auto auto;
  }
  .col-output { grid-column: 1; grid-row: 1; }
  .col-auto { grid-column: 2; grid-row: 1; align-items: flex-end; }
  .bottom-row { grid-row: 2; }
</style>
</head>
<body>
  <main class="stage" aria-label="Automatisering en financiële verwerking">
    <div class="grid">

      <!-- OUTPUT (blue group) -->
      <section class="col col-output" aria-labelledby="lbl-out">
        <span class="label" id="lbl-out">Output</span>
        <div class="card bluecard" role="group">
          <div class="bluecard-list">
            <button class="brow" type="button">
              <span class="ico" aria-hidden="true">
                <!-- list with bullets -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="7" r="1.2" fill="currentColor"/><circle cx="5" cy="12" r="1.2" fill="currentColor"/><circle cx="5" cy="17" r="1.2" fill="currentColor"/><path d="M9 7h11M9 12h11M9 17h11"/></svg>
              </span>
              Deelnemerslijsten
            </button>
            <button class="brow" type="button">
              <span class="ico" aria-hidden="true">
                <!-- badge / sticker (rounded sun shape) -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 1.6 2.4-.4.6 2.3 2.3.6-.4 2.4L20.3 11l-1.6 1.8.4 2.4-2.3.6-.6 2.3-2.4-.4L12 19.3 10.2 17.7l-2.4.4-.6-2.3-2.3-.6.4-2.4L3.7 11l1.6-1.8-.4-2.4 2.3-.6.6-2.3 2.4.4z"/></svg>
              </span>
              Badges
            </button>
            <button class="brow" type="button">
              <span class="ico" aria-hidden="true">
                <!-- document with lines -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 17h5"/></svg>
              </span>
              Rapporten
            </button>
          </div>
        </div>
      </section>

      <!-- AUTOMATISERINGEN (white card) -->
      <section class="col col-auto" aria-labelledby="lbl-auto">
        <span class="label" id="lbl-auto" style="align-self:flex-end;">Automatiseringen</span>
        <div class="card whitecard" role="group" style="width:100%;">
          <div class="whitecard-list">
            <button class="wrow" type="button">
              <span class="ico" aria-hidden="true">
                <!-- invoice / billing -->
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/><circle cx="13" cy="15" r="3"/><path d="M9 12h2M9 19h3"/></svg>
              </span>
              <div>
                <h3>Facturering</h3>
                <p>Automatische facturen op basis van inschrijving</p>
              </div>
            </button>
            <button class="wrow" type="button">
              <span class="ico" aria-hidden="true">
                <!-- prohibit / cancel -->
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>
              </span>
              <div>
                <h3>Annuleringen</h3>
                <p>Verwerking van annuleringen en kosten</p>
              </div>
            </button>
            <button class="wrow" type="button">
              <span class="ico" aria-hidden="true">
                <!-- check circle -->
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16 10"/></svg>
              </span>
              <div>
                <h3>Bevestigingen</h3>
                <p>Directe bevestiging na inschrijving</p>
              </div>
            </button>
          </div>
        </div>
      </section>

      <!-- EVENEMENTTYPEN (3-up bottom row, no icons in original) -->
      <section class="col bottom-row" aria-labelledby="lbl-ev">
        <span class="label" id="lbl-ev">Evenementtypen</span>
        <div class="three-row">
          <button class="card minicard" type="button">
            <div class="top">Congressen</div>
            <div class="sub">Inrichting voor grootschalige events</div>
          </button>
          <button class="card minicard" type="button">
            <div class="top">Seminars</div>
            <div class="sub">Ondersteuning voor kleinschalige sessies</div>
          </button>
          <button class="card minicard" type="button">
            <div class="top">Trainingen</div>
            <div class="sub">Registratie en planning van trainingen</div>
          </button>
        </div>
      </section>

    </div>
  </main>
</body>
</html>
