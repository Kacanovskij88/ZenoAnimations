<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Segmentatie en doelgroepbeheer</title>
<link rel="stylesheet" href="_shared.css" />
<style>
  .grid { grid-template-columns: 1fr; justify-items: center; align-items: center; }
  .col-int { max-width: 540px; width: 100%; align-items: center; }
</style>
</head>
<body>
  <main class="stage" aria-label="Segmentatie en doelgroepbeheer">
    <div class="grid">
      <section class="col col-int" aria-labelledby="lbl-int">
        <span class="label" id="lbl-int">Integraties</span>
        <div class="card whitecard" role="group" style="width:100%;">
          <div class="whitecard-list">
            <button class="wrow" type="button"><span class="ico" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span><div><h3>Copernica</h3><p>Segmenten gebruiken voor e-mailcampagnes en automation</p></div></button>
            <button class="wrow" type="button"><span class="ico" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.5-5.7L20 8"/><path d="M20 4v4h-4"/><path d="M20 12a8 8 0 0 1-13.5 5.7L4 16"/><path d="M4 20v-4h4"/></svg></span><div><h3>Selligent</h3><p>Doelgroepen koppelen aan marketing automation flows</p></div></button>
            <button class="wrow" type="button"><span class="ico" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/><circle cx="18" cy="17" r="3" fill="currentColor"/></svg></span><div><h3>Mailchimp</h3><p>Segmenten inzetten voor nieuwsbrieven en campagnes</p></div></button>
            <button class="wrow" type="button"><span class="ico" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 1 0-5.7-5.7l-1.5 1.5"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 1 0 5.7 5.7L12.5 17"/></svg></span><div><h3>Overige</h3><p>Koppelingen met andere marketing- en datasystemen</p></div></button>
          </div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
