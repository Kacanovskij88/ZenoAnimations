<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Beheer van opportunities en sales pipelines</title>
<link rel="stylesheet" href="_shared.css" />
<style>
  /* Layout: Taakbeheer left-bottom, Dealpijplijn right-top */
  .grid {
    grid-template-columns: 1fr 1.55fr;
    grid-template-rows: auto 1fr;
  }
  .col-taak { grid-column: 1; grid-row: 2; align-self: end; }
  .col-deal { grid-column: 2; grid-row: 1 / span 2; align-items: flex-end; }
</style>
</head>
<body>
  <main class="stage" aria-label="Beheer van opportunities en sales pipelines">
    <div class="grid">

      <!-- TAAKBEHEER (blue group) -->
      <section class="col col-taak" aria-labelledby="lbl-taak">
        <span class="label" id="lbl-taak">Taakbeheer</span>
        <div class="card bluecard" role="group">
          <div class="bluecard-list">
            <button class="brow" type="button">
              <span class="ico" aria-hidden="true">
                <!-- columns / kanban -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="4" height="16" rx="1"/><rect x="10" y="4" width="4" height="16" rx="1"/><rect x="16" y="4" width="4" height="16" rx="1"/></svg>
              </span>
              Kanbanbord
            </button>
            <button class="brow" type="button">
              <span class="ico" aria-hidden="true">
                <!-- calendar -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4M16 3v4"/></svg>
              </span>
              Kalenderweergave
            </button>
            <button class="brow" type="button">
              <span class="ico" aria-hidden="true">
                <!-- list -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="7" r="1.2" fill="currentColor"/><circle cx="5" cy="12" r="1.2" fill="currentColor"/><circle cx="5" cy="17" r="1.2" fill="currentColor"/><path d="M9 7h11M9 12h11M9 17h11"/></svg>
              </span>
              Lijstweergave
            </button>
          </div>
        </div>
      </section>

      <!-- DEALPIJPLIJN (white card) -->
      <section class="col col-deal" aria-labelledby="lbl-deal">
        <span class="label" id="lbl-deal" style="align-self:flex-end;">Dealpijplijn</span>
        <div class="card whitecard" role="group" style="width:100%;">
          <div class="whitecard-list">
            <button class="wrow" type="button">
              <span class="ico" aria-hidden="true">
                <!-- lightbulb -->
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1.5 1.5 1.5 3v.5h5v-.5c0-1.5.8-2.3 1.5-3A6 6 0 0 0 12 3z"/></svg>
              </span>
              <div>
                <h3>Opportunities</h3>
                <p>Kansen inzichtelijk vanaf eerste contact</p>
              </div>
            </button>
            <button class="wrow" type="button">
              <span class="ico" aria-hidden="true">
                <!-- document -->
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 17h7"/></svg>
              </span>
              <div>
                <h3>Offertes</h3>
                <p>Offertes direct gekoppeld aan opportunities</p>
              </div>
            </button>
            <button class="wrow" type="button">
              <span class="ico" aria-hidden="true">
                <!-- shopping cart -->
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.5 11.5a2 2 0 0 0 2 1.5h7.5a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/></svg>
              </span>
              <div>
                <h3>Bestellingen</h3>
                <p>Orders naadloos verwerkt vanuit offertes</p>
              </div>
            </button>
            <button class="wrow" type="button">
              <span class="ico" aria-hidden="true">
                <!-- invoice / document with circle -->
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/><circle cx="13" cy="15" r="3"/><path d="M9 12h2M9 19h3"/></svg>
              </span>
              <div>
                <h3>Facturen</h3>
                <p>Facturatie direct gekoppeld aan salesproces</p>
              </div>
            </button>
          </div>
        </div>
      </section>

    </div>
  </main>
</body>
</html>
