<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voorraadbeheer en productcontrole</title>
<link rel="stylesheet" href="_shared.css" />
<style>
  .grid { grid-template-columns: 1fr 1.3fr; align-items: center; }
  .col-ps { grid-column: 1; align-items: flex-start; align-self: center; }
  .col-pr { grid-column: 2; align-items: flex-end; align-self: center; }
</style>
</head>
<body>
  <main class="stage" aria-label="Voorraadbeheer en productcontrole">
    <div class="grid">
      <section class="col col-ps" aria-labelledby="lbl-ps">
        <span class="label" id="lbl-ps">Productstructuur</span>
        <div class="card bluecard" role="group">
          <div class="bluecard-list">
            <button class="brow" type="button"><span class="ico" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11V5a2 2 0 0 1 2-2h6l10 10a2 2 0 0 1 0 2.8l-6.2 6.2a2 2 0 0 1-2.8 0L3 13z"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/></svg></span>Losse artikelen</button>
            <button class="brow" type="button"><span class="ico" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 7v10l8 4 8-4V7z"/><path d="M4 7l8 4 8-4"/><path d="M12 11v10"/></svg></span>Samengestelde artikelen</button>
            <button class="brow" type="button"><span class="ico" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l7-4 7 4-7 4z"/><path d="M5 12l7 4 7-4"/><path d="M5 16l7 4 7-4"/></svg></span>Gessembleerde artikelen</button>
          </div>
        </div>
      </section>
      <section class="col col-pr" aria-labelledby="lbl-pr">
        <span class="label" id="lbl-pr" style="align-self:flex-end;">Producten</span>
        <div class="card whitecard" role="group" style="width:100%;">
          <div class="whitecard-list">
            <button class="wrow" type="button"><span class="ico" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h6a3 3 0 0 1 3 3v11a3 3 0 0 0-3-3H3z"/><path d="M21 5h-6a3 3 0 0 0-3 3v11a3 3 0 0 1 3-3h6z"/></svg></span><div><h3>Boeken</h3><p>Fysieke uitgaven en titels</p></div></button>
            <button class="wrow" type="button"><span class="ico" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 7v10l8 4 8-4V7z"/><path d="M4 7l8 4 8-4"/><path d="M12 11v10"/></svg></span><div><h3>Fysiek</h3><p>Merchandise en aanvullende producten</p></div></button>
            <button class="wrow" type="button"><span class="ico" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="11" rx="2"/><path d="M2 20h20"/></svg></span><div><h3>Digitaal</h3><p>E-books en online content</p></div></button>
            <button class="wrow" type="button"><span class="ico" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V4h12v5"/><rect x="3" y="9" width="18" height="9" rx="2"/><rect x="7" y="14" width="10" height="6" rx="1.2"/></svg></span><div><h3>Print-on-demand</h3><p>Productie op aanvraag, zonder voorraad</p></div></button>
          </div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
