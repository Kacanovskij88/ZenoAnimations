<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flexibele facturatie</title>
<link rel="stylesheet" href="_shared.css" />
<style>
  .grid {
    grid-template-columns: 0.85fr 1fr 0.7fr;
    grid-template-rows: auto auto;
    gap: 18px 22px;
    padding: 30px 36px 30px;
  }
  .col-btw  { grid-column: 1; grid-row: 1; align-items: flex-start; align-self: center; }
  .col-inc  { grid-column: 2; grid-row: 1; align-items: center; }
  .col-side { grid-column: 3; grid-row: 1; align-items: flex-start; gap: 18px; }
  .col-ship { grid-column: 1 / -1; grid-row: 2; align-items: center; margin-top: 4px; }

  .pill-card {
    background: var(--panel);
    border-radius: var(--r-pill);
    padding: 10px 22px 10px 14px;
    box-shadow: var(--shadow-sm);
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    width: fit-content;
  }
  .pill-card .ico-mini {
    width: 22px; height: 22px;
    display: grid; place-items: center;
    color: var(--ink);
    flex: none;
  }

  .side-block { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }

  .col-ship .three-row { max-width: 720px; }
  .col-ship .minicard { text-align: left; align-items: flex-start; padding: 12px 16px; }

  .whitecard.compact { padding: 14px 22px; }
  .whitecard.compact .wrow { padding: 9px 6px; gap: 14px; }
  .whitecard.compact .wrow + .wrow { border-top: 0; }
  .whitecard.compact .wrow .ico {
    background: var(--dark-tile); color: #fff;
    width: 32px; height: 32px; border-radius: 8px;
  }
  .whitecard.compact .wrow:hover .ico { background: var(--dark-tile); transform: scale(1.06); }
  .whitecard.compact .wrow h3 { font-size: 17px; margin: 0; }
</style>
</head>
<body>
  <main class="stage" aria-label="Flexibele facturatie">
    <div class="grid">

      <!-- BTW (blue group) -->
      <section class="col col-btw" aria-labelledby="lbl-btw">
        <span class="label" id="lbl-btw">BTW</span>
        <div class="card bluecard" role="group">
          <div class="bluecard-list">
            <button class="brow" type="button">
              <span class="ico" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="2.4"/><circle cx="17" cy="17" r="2.4"/><path d="M19 5 5 19"/></svg>
              </span>
              Binnenland
            </button>
            <button class="brow" type="button">
              <span class="ico" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="2.4"/><circle cx="17" cy="17" r="2.4"/><path d="M19 5 5 19"/></svg>
              </span>
              EU BTW
            </button>
            <button class="brow" type="button">
              <span class="ico" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="2.4"/><circle cx="17" cy="17" r="2.4"/><path d="M19 5 5 19"/></svg>
              </span>
              Internationaal
            </button>
          </div>
        </div>
      </section>

      <!-- INKOMSTENBRON (compact white card with dark icons) -->
      <section class="col col-inc" aria-labelledby="lbl-inc">
        <span class="label" id="lbl-inc">Inkomstenbron</span>
        <div class="card whitecard compact" role="group" style="width:100%;">
          <div class="whitecard-list">
            <button class="wrow" type="button">
              <span class="ico" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.5-5.7L20 8"/><path d="M20 4v4h-4"/><path d="M20 12a8 8 0 0 1-13.5 5.7L4 16"/><path d="M4 20v-4h4"/></svg>
              </span>
              <div><h3>Abonnementen</h3></div>
            </button>
            <button class="wrow" type="button">
              <span class="ico" aria-hidden="true">
                <!-- megaphone -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2l11 5V6z"/><path d="M14 9a3 3 0 0 1 0 6"/><path d="M6 13v3a2 2 0 0 0 4 0v-1"/></svg>
              </span>
              <div><h3>Advertenties</h3></div>
            </button>
            <button class="wrow" type="button">
              <span class="ico" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.5 11.5a2 2 0 0 0 2 1.5h7.5a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/></svg>
              </span>
              <div><h3>Orders</h3></div>
            </button>
            <button class="wrow" type="button">
              <span class="ico" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/><path d="M10 6v12"/></svg>
              </span>
              <div><h3>Evenementen</h3></div>
            </button>
          </div>
        </div>
      </section>

      <!-- LAY-OUT + VALUTA (right side stack) -->
      <section class="col col-side">
        <div class="side-block" aria-labelledby="lbl-lay">
          <span class="label" id="lbl-lay">Lay-out</span>
          <button class="card pill-card" type="button">
            <span class="ico-mini" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.2"/><rect x="13" y="4" width="7" height="7" rx="1.2"/><rect x="4" y="13" width="7" height="7" rx="1.2"/><rect x="13" y="13" width="7" height="7" rx="1.2"/></svg>
            </span>
            Standaard
          </button>
          <button class="card pill-card" type="button">
            <span class="ico-mini" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l4 4-9 9H5v-4z"/><path d="M14 6l2-2a2 2 0 0 1 3 3l-2 2"/></svg>
            </span>
            Op maat
          </button>
        </div>

        <div class="side-block" aria-labelledby="lbl-val">
          <span class="label" id="lbl-val">Valuta</span>
          <button class="card pill-card" type="button">
            <span class="ico-mini" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg>
            </span>
            Enkele valuta
          </button>
          <button class="card pill-card" type="button">
            <span class="ico-mini" aria-hidden="true">
              <!-- stacked coins -->
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="7" rx="7" ry="2.5"/><path d="M5 7v3c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5V7"/><path d="M5 12v3c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-3"/></svg>
            </span>
            Meerdere valuta
          </button>
        </div>
      </section>

      <!-- VERZENDING (3-up bottom) -->
      <section class="col col-ship" aria-labelledby="lbl-ship">
        <span class="label" id="lbl-ship">Verzending</span>
        <div class="three-row">
          <button class="card minicard" type="button">
            <div class="top">
              <span class="ico-amber" aria-hidden="true">
                <!-- paper plane -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 3 11l7 3 3 7z"/><path d="M21 3 11 14"/></svg>
              </span>
              Peppol
            </div>
            <div class="sub">Bezorging gaat via Peppol</div>
          </button>
          <button class="card minicard" type="button">
            <div class="top">
              <span class="ico-amber" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9V4h10v5"/><rect x="3" y="9" width="18" height="9" rx="2"/><rect x="7" y="14" width="10" height="6" rx="1.2"/></svg>
              </span>
              Print
            </div>
            <div class="sub">Bezorging gaat via print</div>
          </button>
          <button class="card minicard" type="button">
            <div class="top">
              <span class="ico-amber" aria-hidden="true">
                <!-- envelope -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
              </span>
              E-mail
            </div>
            <div class="sub">Bezorging gaat via e-mail</div>
          </button>
        </div>
      </section>

    </div>
  </main>
</body>
</html>
